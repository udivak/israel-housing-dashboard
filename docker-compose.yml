services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector_service:
    build:
      context: ./collector_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard_service:
    build:
      context: ./dashboard_service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard_app:
    build:
      context: ./dashboard_app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      dashboard_service:
        condition: service_healthy

  streamlit_app:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_URL: http://dashboard_service:8000
    depends_on:
      dashboard_service:
        condition: service_healthy

  pre_processing:
    build:
      context: ./pre_processing
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NORMALIZED_URI: mongodb://mongo:27017
      OSM_DATA_DIR: /data/osm
      PARCEL_PATH: /data/parcel_all/PARCEL_ALL.shp
      FEATURES_OUTPUT_CSV: /outputs/features_osm.csv
      TEMPORAL_OUTPUT_XLSX: /outputs/temporal_features.xlsx
    volumes:
      - ./data/osm:/data/osm:ro
      - ./data/parcel_all:/data/parcel_all:ro
      - ./pre_processing/outputs:/outputs
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
